<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Compile target5 → targets.mind</title>
    <script>
      window.AFRAME = {
        registerSystem() {},
        registerComponent() {},
        THREE: { Matrix4: function () { this.set = function () {}; this.compose = function () {}; this.multiply = function () {}; this.elements = []; } },
      };
    </script>
    <script src="/tools/lib/mindar-image-aframe.prod.js"></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 480px;
        margin: 40px auto;
        padding: 0 20px;
      }
    </style>
  </head>
  <body>
    <h1>Compile AR Target</h1>
    <p id="status">Loading compiler…</p>
    <script>
      (async () => {
        const status = document.getElementById("status");
        try {
          const params = new URLSearchParams(location.search);
          const imagesParam = params.get("images") || params.get("image") || "/assets/target5.png";
          const paths = imagesParam.split(",").map((s) => s.trim()).filter(Boolean);

          const loadImage = (src) =>
            new Promise((resolve, reject) => {
              const img = new Image();
              img.crossOrigin = "anonymous";
              img.onload = () => resolve(img);
              img.onerror = reject;
              img.src = src;
            });

          status.textContent = `Compiling ${paths.length} target(s)…`;
          const images = await Promise.all(paths.map(loadImage));

          const compiler = new MINDAR.IMAGE.Compiler();
          await compiler.compileImageTargets(images, (p) => {
            status.textContent = `Compiling… ${Math.round(p)}%`;
          });

          const buffer = compiler.exportData();
          window.__MIND_BUFFER__ = Array.from(new Uint8Array(buffer));

          const blob = new Blob([buffer]);
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "targets.mind";
          a.click();

          status.textContent = "Done! targets.mind downloaded — move it to assets/targets.mind";
        } catch (err) {
          window.__MIND_COMPILE_ERROR__ = err.message;
          status.textContent = "Error: " + err.message;
          console.error(err);
        }
      })();
    </script>
  </body>
</html>
